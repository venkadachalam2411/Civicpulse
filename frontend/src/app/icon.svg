<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield/Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Inner Vibrant Gradient Tile -->
  <rect x="6" y="6" width="52" height="52" rx="13" fill="url(#cpGrad)" />
  
  <!-- Inner Beacon Glow Center -->
  <circle cx="32" cy="32" r="18" fill="#0f172a" fill-opacity="0.3" />

  <!-- Crisp Civic Pulse Waveform -->
  <path
    d="M14 33h7l4-11 7 20 5-13 4 5 9-1"
    fill="none"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  
  <!-- Sparkle Accent Dot -->
  <circle cx="48" cy="18" r="3.5" fill="#facc15" />
</svg>
